name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"
  PYTHONIOENCODING: utf-8
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    name: Lint (Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: python -m pip install ruff==0.16.10
      - name: Syntax errors and undefined names
        run: ruff check --output-format=github .
      - name: Compile all Python files
        run: python -m compileall -q -x "(venv|whisper-venv|node_modules|\.next)" .

  backend:
    name: Backend tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Image to PDF smoke test
        run: python -m imgpdf.smoke_test

  frontend:
    name: Dashboard (types and build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit -p .
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end (launcher, server and dashboard)
    runs-on: windows-latest
    needs: [backend, frontend]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Create the environment like the installer does
        run: |
          python -m venv venv
          venv\Scripts\python.exe -m pip install --upgrade pip
          venv\Scripts\python.exe -m pip install -r requirements.txt -c constraints.txt
      - name: Cache the background removal model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.u2net
          key: u2net-isnet-general-use-v1
      - name: Download the default model (ISNet)
        run: venv\Scripts\python.exe -c "from rembg import new_session; new_session('isnet-general-use')"
      - name: Build the dashboard
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Run the server and dashboard, then test through the launcher and the API proxy
        run: |
          $server = Start-Process -FilePath "venv\Scripts\python.exe" -ArgumentList "server.py" -NoNewWindow -PassThru -RedirectStandardOutput server.log -RedirectStandardError server.err.log
          $web = Start-Process -FilePath "npm.cmd" -ArgumentList "run", "start" -WorkingDirectory web -NoNewWindow -PassThru -RedirectStandardOutput web.log -RedirectStandardError web.err.log
          try {
            foreach ($url in "http://127.0.0.1:8000/api/health", "http://localhost:5174") {
              $ok = $false
              for ($i = 0; $i -lt 90; $i++) {
                try {
                  if ((Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 10).StatusCode -eq 200) { $ok = $true; break }
                } catch {}
                Start-Sleep -Seconds 2
              }
              if (-not $ok) { throw "$url did not respond" }
              Write-Host "$url is up"
            }

            cmd /c "sharpz.cmd test < nul"
            if ($LASTEXITCODE -ne 0) { throw "smoke test through sharpz.cmd failed with exit code $LASTEXITCODE" }

            $page = Invoke-WebRequest -Uri "http://localhost:5174" -UseBasicParsing
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch "Sharpz") { throw "the dashboard did not load" }
            $models = Invoke-RestMethod -Uri "http://localhost:5174/api/models"
            $default = $models.models | Where-Object { $_.is_default }
            if ($default.key -ne "isnet-general-use") { throw "unexpected default model: $($default.key)" }
            $code = curl.exe -s -o error.json -w "%{http_code}" -F "file=@README.md;type=image/png" "http://localhost:5174/api/clean"
            $detail = (Get-Content error.json -Raw -Encoding utf8 | ConvertFrom-Json).detail
            if ($code -ne "400" -or $detail -notmatch "Imagem inv") { throw "the friendly error did not come through the proxy: $code $detail" }
            $codeEn = curl.exe -s -o error-en.json -w "%{http_code}" -H "Accept-Language: en" -F "file=@README.md;type=image/png" "http://localhost:5174/api/clean"
            $detailEn = (Get-Content error-en.json -Raw -Encoding utf8 | ConvertFrom-Json).detail
            if ($codeEn -ne "400" -or $detailEn -notmatch "Invalid image") { throw "the English error did not come through the proxy: $codeEn $detailEn" }
            if ($page.Content -notmatch "PT-BR") { throw "the language switch is missing from the dashboard" }
            Write-Host "dashboard ok, default model $($default.key), friendly errors: $detail | $detailEn"
          } finally {
            foreach ($proc in $server, $web) {
              if ($proc -and -not $proc.HasExited) { taskkill /T /F /PID $proc.Id | Out-Null }
            }
            $global:LASTEXITCODE = 0
          }
      - name: Logs
        if: always()
        run: |
          foreach ($file in "server.log", "server.err.log", "web.log", "web.err.log") {
            if (Test-Path $file) { Write-Host "===== $file"; Get-Content $file -Tail 80 }
          }
